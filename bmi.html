<!DOCTYPE html>
<html>

<head>
<title>BMI Calculator</title>
</head>

<body>

<h2>BMI Calculator</h2>

<input id="height" placeholder="Enter height in meters">
<br><br>

<input id="weight" placeholder="Enter weight in kg">
<br><br>

<button onclick="checkBMI()">Calculate BMI</button>

<p id="result"></p>

<script>

function checkBMI(){

let height = document.getElementById("height").value;
let weight = document.getElementById("weight").value;

let bmi = weight / (height * height);

if(bmi < 18.5){
document.getElementById("result").innerText = "Underweight";
}

else if(bmi < 25){
document.getElementById("result").innerText = "Normal weight";
}

else if(bmi < 30){
document.getElementById("result").innerText = "Overweight";
}

else{
document.getElementById("result").innerText = "Obese";
}

}

</script>

</body>

</html>
